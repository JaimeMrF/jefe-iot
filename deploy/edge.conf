# Multiplexa el 443 por SNI: mqtt.* -> Mosquitto (TLS de extremo a extremo), todo lo demas -> Caddy.
# Asi la placa usa MQTT/TLS por el 443 y no depende de que el proveedor abra puertos extra.
worker_processes auto;
events { worker_connections 1024; }
stream {
  resolver 127.0.0.11 valid=10s;
  map $ssl_preread_server_name $upstream {
    ~^mqtt\.   mosquitto:8883;
    default    caddy:443;
  }
  server {
    listen 443;
    ssl_preread on;
    proxy_pass $upstream;
    proxy_connect_timeout 5s;
    proxy_timeout 1h;
  }
}
