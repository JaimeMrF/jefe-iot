[agent]
  interval = "10s"
  flush_interval = "5s"
  omit_hostname = true

# Toda la telemetria: jefe/<dispositivo>/telemetry  (JSON con campos numericos)
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["jefe/+/telemetry"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  data_format = "json"
  name_override = "iot"
  [[inputs.mqtt_consumer.topic_parsing]]
    topic = "jefe/+/telemetry"
    tags = "_/device/_"

# Alertas y eventos: jefe/<dispositivo>/event  {rule, severity, device, value, msg}
[[inputs.mqtt_consumer]]
  servers = ["tcp://mosquitto:1883"]
  topics = ["jefe/+/event"]
  username = "${MQTT_USER}"
  password = "${MQTT_PASS}"
  data_format = "json"
  name_override = "alerts"
  tag_keys = ["rule", "severity", "device"]
  json_string_fields = ["msg"]

[[outputs.influxdb_v2]]
  urls = ["http://influxdb:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
