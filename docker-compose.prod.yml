# Produccion (VPS). Uso:  docker compose -f docker-compose.prod.yml up -d
# Solo se publican 80 (Caddy, validacion ACME y redireccion) y 443 (nginx, que reparte por SNI a Caddy o Mosquitto).
# Todo lo demas queda en la red interna. InfluxDB solo en 127.0.0.1 (tunel SSH).
# OJO: no renombrar servicios ni volumenes (se perderian los datos y los certificados).
name: jefe-iot

# Logs rotados: maximo 3 archivos de 10 MB por contenedor
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./panel:/srv/panel:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # API de administracion local de Caddy (la usa tambien "caddy reload")
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:2019/config/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m

  # Puerta unica del 443: reparte por SNI (mqtt.* -> Mosquitto, resto -> Caddy)
  edge:
    image: nginx:1.30-alpine
    restart: unless-stopped
    logging: *logging
    depends_on: [caddy, mosquitto]
    ports:
      - "443:443"
    volumes:
      - ./deploy/edge.conf:/etc/nginx/nginx.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 443 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m

  mosquitto:
    image: eclipse-mosquitto:2.0.20
    restart: unless-stopped
    logging: *logging
    user: root            # necesita leer la llave TLS emitida por Caddy (despues baja privilegios)
    entrypoint: ["/bin/sh", "/config-tpl/entrypoint.sh"]
    depends_on: [caddy]
    environment:
      DOMAIN: ${DOMAIN}
      MQTT_ESP_PASS: ${MQTT_ESP_PASS}
      MQTT_PANEL_PASS: ${MQTT_PANEL_PASS}
      MQTT_BACKEND_PASS: ${MQTT_BACKEND_PASS}
    volumes:
      - ./mosquitto:/config-tpl:ro
      - caddy-data:/caddy:ro
      - mosquitto-data:/mosquitto/data
    healthcheck:
      # Se autentica como backend y publica en un topico que nadie consume (jefe/healthcheck/ping).
      # start_period largo: en el primer arranque espera a que Caddy emita el certificado.
      test: ["CMD-SHELL", "mosquitto_pub -h 127.0.0.1 -p 1883 -u backend -P \"$$MQTT_BACKEND_PASS\" -t jefe/healthcheck/ping -m 1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 300s
    mem_limit: 128m

  influxdb:
    image: influxdb:2.7.12
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUX_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUX_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUX_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUX_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUX_TOKEN}
      # Solo aplica la primera vez (volumen vacio). En un servidor ya creado: ver docs/DEPLOY.md, "Retencion"
      DOCKER_INFLUXDB_INIT_RETENTION: ${INFLUX_RETENTION:-90d}
    volumes:
      - influx-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping", "--host", "http://127.0.0.1:8086"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 1g

  telegraf:
    image: telegraf:1.32.3
    restart: unless-stopped
    logging: *logging
    depends_on:
      mosquitto: { condition: service_healthy }
      influxdb: { condition: service_healthy }
    environment:
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
      MQTT_USER: backend
      MQTT_PASS: ${MQTT_BACKEND_PASS}
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    mem_limit: 256m

  # Gemelos digitales, APIs, datasets, logica del jefe y alertas (ver bridge/)
  bridge:
    build: ./bridge
    restart: unless-stopped
    logging: *logging
    user: node            # usuario sin privilegios de la imagen node:*-alpine
    security_opt: ["no-new-privileges:true"]
    depends_on:
      mosquitto: { condition: service_healthy }
    environment:
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USER: backend
      MQTT_PASS: ${MQTT_BACKEND_PASS}
      AZURE_MAPS_KEY: ${AZURE_MAPS_KEY}
      # Persistencia (xp, logros, reportes, personalidad) en el volumen bridge-data
      DATA_DIR: /data
      TZ: ${TZ:-America/Bogota}
      # Telegram (opcional: si falta el token o el chat_id queda desactivado)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      TELEGRAM_MIN_SEVERITY: ${TELEGRAM_MIN_SEVERITY:-warning}
      REPORT_HOUR: ${REPORT_HOUR:-18}
      REPORT_WEEKDAY: ${REPORT_WEEKDAY:-5}
    volumes:
      - ./datasets:/datasets:ro
      - bridge-data:/data
    # healthcheck: lo define bridge/Dockerfile (GET /health en el puerto interno 8081, no publicado)
    mem_limit: 256m

  grafana:
    image: grafana/grafana:11.3.0
    restart: unless-stopped
    logging: *logging
    security_opt: ["no-new-privileges:true"]
    depends_on:
      influxdb: { condition: service_healthy }
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_SERVER_ROOT_URL: https://grafana.${DOMAIN}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      INFLUX_TOKEN: ${INFLUX_TOKEN}
      INFLUX_ORG: ${INFLUX_ORG}
      INFLUX_BUCKET: ${INFLUX_BUCKET}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 512m

volumes:
  caddy-data:
  caddy-config:
  mosquitto-data:
  influx-data:
  grafana-data:
  bridge-data:
