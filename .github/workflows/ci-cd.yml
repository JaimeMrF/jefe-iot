name: CI-CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# Un PR nuevo cancela la validacion anterior del mismo PR. En main NUNCA se cancela a medias
# (un deploy interrumpido dejaria el VPS a medio copiar); los despliegues se encolan (ver job deploy).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Validar (compose, Caddy, bridge, panel, dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker compose (dev y prod)
        run: |
          docker compose --env-file .env.example -f docker-compose.yml config -q
          docker compose --env-file .env.prod.example -f docker-compose.prod.yml config -q

      - name: Validar Caddyfile
        run: |
          docker run --rm -e DOMAIN=ejemplo.com \
            -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11 \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Validar config de nginx (edge) y scripts de shell
        run: |
          # edge.conf apunta a "mosquitto" y "caddy": se resuelven a localhost solo para validar la sintaxis
          docker run --rm --add-host mosquitto:127.0.0.1 --add-host caddy:127.0.0.1 \
            -v "$PWD/deploy/edge.conf:/etc/nginx/nginx.conf:ro" nginx:1.30-alpine nginx -t
          shellcheck -S warning deploy/*.sh mosquitto/entrypoint.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bridge/package-lock.json
      - name: Pruebas del bridge (modelos, datasets, jefe y reglas)
        working-directory: bridge
        run: |
          npm ci
          npm test
      - name: Sintaxis del panel
        run: |
          for f in panel/js/*.js; do
            cp "$f" "/tmp/$(basename "$f" .js).mjs"
            node --check "/tmp/$(basename "$f" .js).mjs"
          done

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: El dashboard de Grafana esta al dia con su generador y es valido
        run: |
          python tools/gen_dashboard.py
          git diff --exit-code grafana/provisioning/
          python tools/check_dashboard.py

  integration:
    name: Integracion (stack completo + consultas del dashboard)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Levantar el stack de desarrollo y esperar los healthchecks
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 180
          docker compose ps
      - name: Esperar telemetria en InfluxDB (bridge -> Mosquitto -> Telegraf)
        run: sleep 45
      - name: Ejecutar todas las consultas del dashboard contra Grafana
        run: |
          set -a; . ./.env; set +a
          python3 tools/check_dashboard.py http://localhost:3000 "$GRAFANA_USER" "$GRAFANA_PASSWORD" now-15m
      - name: Logs si algo fallo
        if: failure()
        run: docker compose logs --tail 80
      - name: Apagar
        if: always()
        run: docker compose down -v

  firmware:
    name: Compilar firmware ESP32-CAM
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: firmware/platformio.ini
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
      - name: Compilar
        run: |
          pip install -q platformio
          pio run -d firmware
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32cam
          path: firmware/.pio/build/esp32cam/firmware.bin

  deploy:
    name: Desplegar en el VPS
    needs: [validate, integration, firmware]
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # Nunca dos despliegues a la vez: el siguiente espera a que termine el anterior
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_PORT: ${{ secrets.VPS_PORT }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
    steps:
      - uses: actions/checkout@v4

      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_KEY }}

      - name: Confiar en el host del VPS
        run: |
          mkdir -p ~/.ssh
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            # Recomendado: huella fija guardada como secreto (evita un ataque de intermediario)
            printf '%s\n' "$VPS_KNOWN_HOSTS" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          fi

      - name: Copiar archivos al VPS
        run: |
          rsync -az --delete -e "ssh -p ${VPS_PORT:-22}" \
            --exclude '.git' --exclude '.github' --exclude '.env' --exclude '.deploy-hash*' \
            --exclude 'firmware/.pio' --exclude 'node_modules' \
            ./ "$VPS_USER@$VPS_HOST:/opt/jefe-iot/"

      - name: Desplegar
        run: ssh -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" 'bash /opt/jefe-iot/deploy/deploy.sh'
