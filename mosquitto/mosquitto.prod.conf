persistence true
persistence_location /mosquitto/data/
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Interno (Telegraf, Node-RED). No se publica fuera de Docker.
listener 1883
protocol mqtt

# La placa, por internet, cifrado (nginx lo expone en el 443 segun SNI mqtt.*)
listener 8883
protocol mqtt
certfile __CERT__
keyfile __KEY__
tls_version tlsv1.2

# El panel (detras de Caddy en wss://dominio/mqtt)
listener 9001
protocol websockets
