persistence true
persistence_location /mosquitto/data/
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Limites contra abusos: un JPEG QVGA de la placa pesa ~10-30 KB; 1 MB deja margen de sobra.
max_packet_size 1048576
# Sesiones persistentes de clientes que no vuelven se borran a los 7 dias (no crece mosquitto.db)
persistent_client_expiration 7d

# Interno (bridge y Telegraf). No se publica fuera de Docker.
listener 1883
protocol mqtt

# La placa, por internet, cifrado (nginx lo expone en el 443 segun SNI mqtt.*)
listener 8883
protocol mqtt
certfile __CERT__
keyfile __KEY__
tls_version tlsv1.2

# El panel (detras de Caddy en wss://dominio/mqtt)
listener 9001
protocol websockets
